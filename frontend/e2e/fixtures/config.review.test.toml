# Hecatoncheires E2E Test Configuration — thread mode
# A second workspace used to exercise the thread-per-case mode in E2E:
# the Kanban board renders Cases (not Actions) grouped by [case.status].

[workspace]
id   = "review"
name = "E2E Review (thread)"

# Labels are intentionally left at the defaults ("Case") so the shared Case
# page objects (which match the "New Case" / "New Case" form labels) work
# against this workspace too.

[slack]
mode    = "thread"
channel = "C0E2EREVIEW"

[case]
initial = "triage"
closed  = ["done"]

[[case.status]]
id    = "triage"
name  = "Triage"
color = "idle"

[[case.status]]
id    = "in_review"
name  = "In Review"
color = "active"

[[case.status]]
id    = "done"
name  = "Done"
color = "success"

[[fields]]
id       = "review_type"
name     = "Review Type"
type     = "select"
required = false
options = [
  { id = "code", name = "Code" },
  { id = "design", name = "Design" },
]

# Optional fields for shared, compound Case field filters.
[[fields]]
id = "priority"
name = "Priority"
type = "select"
required = false
options = [
  { id = "low", name = "Low" },
  { id = "medium", name = "Medium" },
  { id = "high", name = "High" },
]

[[fields]]
id = "teams"
name = "Teams"
type = "multi-select"
required = false
options = [
  { id = "platform", name = "Platform" },
  { id = "product", name = "Product" },
]

[[fields]]
id = "ticket"
name = "Ticket"
type = "text"
required = false

[[fields]]
id = "estimate"
name = "Estimate"
type = "number"
required = false

[[fields]]
id = "due"
name = "Due"
type = "date"
required = false

[[fields]]
id = "related"
name = "Related"
type = "multi_case_ref"
reference_workspace = "test"
required = false
