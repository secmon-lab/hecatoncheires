# Global (deployment-wide) configuration.
#
# Pass this file via --global-config, NOT --config:
#
#   hecatoncheires serve \
#     --config ./examples/workspaces/ \
#     --global-config ./examples/global.toml
#
# Files under --config are always "1 file = 1 workspace"; deployment-wide
# settings like workspace groups live here instead. This file must NOT contain
# a [workspace] section, and workspace files must NOT contain [[workspace_group]].

# Workspace groups bundle multiple workspaces for organization / navigation.
# Membership is orthogonal: it never changes a workspace's own behavior, and
# groups are entirely optional (omit this file to run without any).

[[workspace_group]]
id          = "operations"
name        = "Operations"
description = "Day-to-day operational workspaces."
members     = ["risk", "recruit"]   # workspace IDs; each must exist under --config

# A workspace may belong to more than one group.
[[workspace_group]]
id          = "risk-review"
name        = "Risk Review"
description = "Workspaces reviewed in the quarterly risk meeting."
members     = ["risk"]

# Deployment-wide agent settings. Unlike [[workspace_group]], this section
# configures the deployment as a whole, so exactly one file may declare it.
[agent]
# What one agent run may spend, sub-agents included, when the Job names no
# budget_usd of its own. --agent-default-budget-usd overrides it; omitting both
# falls back to the built-in $2.00.
default_budget_usd = 3.0

# The models this deployment may use, and what each costs. A Job's llm_model and
# the --llm-model flag both name one of these entries; nothing else may name a
# model, so a typo fails at startup rather than at the hour a Job is due.
#
# Prices are USD per 1M tokens — the unit every provider's pricing page uses.
# Take them from that page, and for a model whose price varies by prompt length
# write the HIGHER tier: under-charging lets a run spend past its budget, while
# over-charging only ends it a little early with what it already found.
#
# Credentials are NOT here: they stay on the command line (--llm-claude-api-key,
# --llm-gemini-project-id, ...), because a secret does not belong in a config file.

[[llm_model]]
# No alias, so the reference name is the model name: "claude-opus-5".
provider                 = "claude"
model                    = "claude-opus-5"
input_usd_per_mtok       = 5.0
output_usd_per_mtok      = 25.0
cache_read_usd_per_mtok  = 0.5
cache_write_usd_per_mtok = 6.25

[[llm_model]]
# An alias lets a Job ask for "cheap" and lets you change what that means later
# without touching any workspace file.
alias                   = "cheap"
provider                = "gemini"
model                   = "gemini-3.7-flash"
input_usd_per_mtok      = 0.75
output_usd_per_mtok     = 3.75
cache_read_usd_per_mtok = 0.075
# cache_write is omitted: only Claude reports cache writes, so it would never
# be charged here.
